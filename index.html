<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสารสนเทศทางการเงิน DTL #33 - อยู่ระหว่างการปรับปรุง</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --ink-soft: #8e8e93;
      --amber: #ff9500;
      --amber-tint: #fff4e5;
      --radius-xl: 28px;
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .maintenance-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      max-width: 540px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
    }

    .icon-wrapper {
      width: 84px;
      height: 84px;
      background: var(--amber-tint);
      color: var(--amber);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.75rem;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }

    p.lead-text {
      font-size: 1.05rem;
      color: var(--ink-soft);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .notice-box {
      background: #f8f9fa;
      border: 1px dashed #d1d1d6;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 0.95rem;
      color: #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .system-tag {
      font-size: 0.8rem;
      color: #aeaeb2;
      margin-top: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="maintenance-card">
    <div class="icon-wrapper">
      <i class="bi bi-tools"></i>
    </div>
    
    <h1>อยู่ระหว่างการปรับปรุง</h1>
    <p class="lead-text">
      ระบบปิดปรับปรุงชั่วคราวเพื่อพัฒนาระบบและตรวจสอบความถูกต้องของข้อมูล
    </p>

    <div class="notice-box">
      <i class="bi bi-info-circle-fill text-warning fs-5"></i>
      <span>หากต้องการดูข้อมูล กรุณาติดต่อ <strong>Admin ประจำห้องเรียนของท่าน</strong></span>
    </div>

    <div class="system-tag">
      ระบบสารสนเทศเพื่อการบริหารจัดการทางการเงินห้องเรียน DTL #33
    </div>
  </div>

</body>
</html>
